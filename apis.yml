name: SUPA
description: >-
  SUPA is an AI data infrastructure company that helps machine learning teams
  build high-quality training datasets through a blend of technology and expert
  human annotation. It delivers data labeling and curation services spanning
  RLHF, LLM training, semantic segmentation, image classification, and medical
  imaging annotation, drawing on domain-expert networks across healthcare,
  manufacturing, robotics, agriculture, design, and industrial sectors. SUPA
  claims annotation accuracy above 95% and delivery of over one million data
  points per week. It publishes datasets on Hugging Face and is backed by 500
  Global. As of enrichment, SUPA exposes no public developer API, SDK, MCP
  server, or /.well-known/ discovery surface — engagement is through its
  sales/contact channels.
